<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>弹幕大战 · DANMAKU</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#eef1f7; --bg2:#e3e8f2; --ink:#0b1220; --ink2:rgba(11,18,32,.62); --ink3:rgba(11,18,32,.38);
  --hair:rgba(11,18,32,.10); --accent:#0a6cff; --accent2:#7c5cff; --green:#17a34a;
  --orange:#e8850c; --red:#e5484d;
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.84); --edge:rgba(255,255,255,.92);
  --blur:22px; --sat:1.8;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 16px 44px rgba(15,23,42,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",system-ui,sans-serif;
  --r-lg:20px; --r-xl:28px; --full:999px;
  --st:env(safe-area-inset-top,0px); --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px);
  --au:20%; --au2:18%; --au3:15%;
}
@media (prefers-color-scheme: dark){
  :root{
    /* 不用纯黑：深色下也带一点蓝，跟站点 bg 同源但更亮一档 */
    --bg:#121724; --bg2:#0a0e18; --ink:#f5f7fb; --ink2:rgba(245,247,251,.66); --ink3:rgba(245,247,251,.40);
    --hair:rgba(255,255,255,.10); --accent:#4c9bff; --accent2:#8f78ff; --green:#32d74b;
    --orange:#ffb340; --red:#ff6b6f;
    --glass:rgba(28,30,38,.56); --glass2:rgba(24,26,34,.82); --edge:rgba(255,255,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.46);
    --au:32%; --au2:28%; --au3:24%;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.45 var(--font);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
/* 背景：极光色块 + 细网格，跟站点一致的浅色玻璃底，不用纯黑 */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58vw 58vw at 12% 8%, color-mix(in srgb,var(--accent) var(--au),transparent), transparent 62%),
    radial-gradient(52vw 52vw at 88% 6%, color-mix(in srgb,var(--accent2) var(--au2),transparent), transparent 60%),
    radial-gradient(66vw 66vw at 72% 96%, color-mix(in srgb,var(--green) var(--au3),transparent), transparent 64%),
    linear-gradient(168deg,var(--bg),var(--bg2))}
#bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(78% 78% at 50% 46%,#000 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(78% 78% at 50% 46%,#000 30%,transparent 100%)}
#cv{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));border:1px solid var(--edge);box-shadow:var(--shadow)}
/* ---------- HUD ---------- */
/* 顶栏：左（血量+昵称）· 中（分数，绝对居中）· 右（时间+按钮），窄屏自动换行不挤爆 */
.hud{position:fixed;z-index:12;top:calc(var(--st) + 8px);left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);
  display:flex;align-items:flex-start;gap:7px;pointer-events:none;flex-wrap:wrap}
.hud>*{display:flex;gap:7px;pointer-events:auto;min-width:0}
.hud .l{max-width:46%;overflow:hidden}
.hud .r{margin-left:auto}
.hud .mid{position:absolute;left:50%;transform:translateX(-50%);margin:0}
@media (orientation:portrait){
  .hud .mid{position:static;transform:none;order:3;flex:1 1 100%;justify-content:center}
  .hud .l{max-width:58%}
}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--full);
  font-size:14px;font-weight:600;letter-spacing:.2px}
.pips{display:inline-flex;gap:5px}
.pip{width:17px;height:9px;border-radius:3px;background:var(--hair);transition:background .18s,transform .18s}
.pip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--green) 92%,#fff),var(--green));
  box-shadow:0 0 10px color-mix(in srgb,var(--green) 55%,transparent)}
.pip.hit{transform:scaleY(1.6);background:var(--red)}
.big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.combo{margin-left:2px;font-style:normal;font-size:12px;font-weight:800;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 8px;border-radius:var(--full)}
.who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-weight:600}
.who b{color:var(--ink)}
.ibtn{width:38px;height:38px;border:1px solid var(--edge);border-radius:var(--full);display:grid;place-items:center;
  color:var(--ink);cursor:pointer;padding:0;transition:transform .14s}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:18px;height:18px;display:block}
.pts{color:var(--ink2);font-weight:600}
/* ---------- 面板 ---------- */
.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:14px}
.panel[hidden]{display:none}
.card{width:min(520px,94vw);max-height:92vh;overflow:auto;padding:20px 22px;border-radius:var(--r-xl);
  background:var(--glass2);-webkit-backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(var(--sat));
  backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(var(--sat));border:1px solid var(--edge);
  box-shadow:var(--shadow);text-align:center}
@media (orientation:landscape) and (max-height:460px){ .card{padding:14px 18px} .card h1{font-size:22px} }
.card h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px}
.card h1 span{background:linear-gradient(96deg,var(--accent),var(--accent2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.card p{margin:8px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.6}
.kbd{display:inline-block;padding:1px 6px;border-radius:6px;border:1px solid var(--hair);
  background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:12px;font-weight:700}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{height:46px;padding:0 22px;border-radius:var(--full);border:1px solid var(--edge);background:var(--glass2);
  color:var(--ink);font:700 15px var(--font);cursor:pointer;transition:transform .14s,filter .14s;
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.btn:active{transform:scale(.96)}
.btn.primary{border-color:transparent;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent)}
.stats{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.stat{min-width:88px;padding:9px 14px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--edge)}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat i{font-style:normal;font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.award{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--accent)}
/* ---------- 竖屏引导 ---------- */
.rot .ph{width:74px;height:74px;margin:2px auto 12px;border-radius:22px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.rot .ph svg{width:42px;height:42px;animation:tilt 2.4s var(--ease,ease-in-out) infinite}
@keyframes tilt{0%,42%{transform:rotate(0)}58%,100%{transform:rotate(-90deg)}}
.link{margin-top:12px;background:none;border:0;color:var(--ink3);font:600 13px var(--font);
  text-decoration:underline;cursor:pointer}
/* ---------- 飘字 ---------- */
.layer{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%) scale(.9);opacity:0;
  padding:9px 16px;border-radius:var(--full);background:var(--glass2);border:1px solid var(--edge);
  box-shadow:var(--shadow);font-weight:700;font-size:14px;white-space:nowrap;
  -webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));animation:up 1.5s ease-out forwards}
@keyframes up{12%{opacity:1;transform:translateX(-50%) scale(1)}72%{opacity:1;transform:translateX(-50%) translateY(-16px)}
  100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
@media (prefers-reduced-motion: reduce){ .rot .ph svg{animation:none} .toast{animation-duration:.5s} }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="l">
    <div class="pill glass"><span class="pips" id="pips"></span></div>
    <div class="pill glass who" id="who">同学 <span class="pts">0 分</span></div>
  </div>
  <div class="mid pill glass"><span class="big" id="score">0</span><i class="combo" id="combo" hidden>x1</i></div>
  <div class="r">
    <div class="pill glass" id="clock">00:00</div>
    <button class="ibtn glass" id="mute" type="button" aria-label="声音开关"></button>
    <button class="ibtn glass" id="pause" type="button" aria-label="暂停">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5.5" width="3.6" height="13" rx="1.4"/><rect x="13.4" y="5.5" width="3.6" height="13" rx="1.4"/></svg>
    </button>
  </div>
</div>

<div class="layer" id="layer"></div>

<div class="panel" id="menu">
  <div class="card">
    <h1>弹幕<span>大战</span></h1>
    <p>拖动屏幕任意位置操控飞船（相对位移，手指不挡船），自动开火。<br />
       打爆往下飘的词语方块，躲开红色弹幕。撞一次掉一格血，共四格。</p>
    <div class="stats">
      <div class="stat"><b id="mBest">0</b><i>最高分</i></div>
      <div class="stat"><b id="mPts">0</b><i>我的积分</i></div>
      <div class="stat"><b>2 万</b><i>每 +1 积分</i></div>
    </div>
    <div class="row">
      <button class="btn primary" id="go" type="button">开始游戏</button>
      <button class="btn" id="gofs" type="button">全屏横屏</button>
    </div>
    <p style="margin-top:10px">电脑上也可以 <span class="kbd">WASD</span> / <span class="kbd">方向键</span> 走位</p>
  </div>
</div>

<div class="panel" id="pause" hidden>
  <div class="card">
    <h1>已暂停</h1>
    <p>离开游戏或切到后台会自动暂停，回来接着打。</p>
    <div class="row">
      <button class="btn primary" id="resume" type="button">继续</button>
      <button class="btn" id="quit" type="button">退出本局</button>
    </div>
  </div>
</div>

<div class="panel" id="over" hidden>
  <div class="card">
    <h1 id="ovTitle">本局结束</h1>
    <div class="stats">
      <div class="stat"><b id="ovScore">0</b><i>得分</i></div>
      <div class="stat"><b id="ovKill">0</b><i>击破</i></div>
      <div class="stat"><b id="ovTime">00:00</b><i>存活</i></div>
    </div>
    <p class="award" id="ovAward"></p>
    <div class="row">
      <button class="btn primary" id="again" type="button">再来一局</button>
      <button class="btn" id="back" type="button">返回大厅</button>
    </div>
  </div>
</div>

<div class="panel rot" id="rotate" hidden>
  <div class="card">
    <div class="ph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M10.4 5.4h3.2"/>
      </svg>
    </div>
    <h1>请横屏游玩</h1>
    <p>弹幕大战是横屏游戏，把手机转过来视野更宽、更好躲。</p>
    <div class="row">
      <button class="btn primary" id="rotGo" type="button">全屏横屏</button>
      <button class="btn" id="rotSkip" type="button">竖屏直接玩</button>
    </div>
  </div>
</div>
<script>
/* ==========================================================================
   弹幕大战 DANMAKU · v2（重写版）
   与原版（Phaser + 9.4MB 内嵌音频）相比：零依赖纯 Canvas2D，整包 30KB 左右，
   横屏优先，浅色玻璃拟态跟站点同一套设计令牌。
   玩法：拖动任意位置做「相对位移」操控飞船（关键修复：船不会瞬移到手指下面，
   手机上一碰就死的问题就是这么来的），自动开火，打爆带单词的方块，躲红弹。
   桥接：postMessage（danmaku-ready / danmaku-player / danmaku-score）。
   ========================================================================== */
(function () {
'use strict';

var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var $ = function (id) { return document.getElementById(id); };
var FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC",system-ui,sans-serif';

var C = {}, DARK = false, W = 0, H = 0, U = 1;

function theme() {
  DARK = window.matchMedia('(prefers-color-scheme: dark)').matches;
  C.ink     = DARK ? '#f5f7fb' : '#0b1220';
  C.accent  = DARK ? '#4c9bff' : '#0a6cff';
  C.accent2 = DARK ? '#8f78ff' : '#7c5cff';
  C.green   = DARK ? '#32d74b' : '#17a34a';
  C.orange  = DARK ? '#ffb340' : '#e8850c';
  C.red     = DARK ? '#ff6b6f' : '#e5484d';
  C.hair    = DARK ? 'rgba(255,255,255,.16)' : 'rgba(11,18,32,.12)';
  C.edge    = DARK ? 'rgba(255,255,255,.20)' : 'rgba(255,255,255,.95)';
  C.chip0   = DARK ? 'rgba(52,56,68,.94)' : 'rgba(255,255,255,.95)';
  C.chip1   = DARK ? 'rgba(28,31,40,.90)' : 'rgba(255,255,255,.70)';
  C.shadow  = DARK ? 'rgba(0,0,0,.5)' : 'rgba(15,23,42,.20)';
  C.glowA   = DARK ? 'rgba(76,155,255,.6)' : 'rgba(10,108,255,.45)';
  C.glowR   = DARK ? 'rgba(255,107,111,.6)' : 'rgba(229,72,77,.42)';
  C.streak  = DARK ? 'rgba(255,255,255,.10)' : 'rgba(11,18,32,.07)';
  C.flame   = DARK ? 'rgba(180,205,255,.55)' : 'rgba(10,108,255,.34)';
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function font(sz, wt) { return (wt || 700) + ' ' + (Math.round(sz * 10) / 10) + 'px ' + FONT; }

/* ---------------------------------------------------------------- 音效（全合成，零素材） */
var AC = null, master = null, muted = false;
function audio() {
  if (AC || muted) return AC;
  try {
    var K = window.AudioContext || window.webkitAudioContext;
    if (!K) return null;
    AC = new K();
    master = AC.createGain();
    master.gain.value = 0.34;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!audio() || muted) return;
  try {
    var t = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol, f0, f1) {
  if (!audio() || muted) return;
  try {
    var n = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, n, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = buf;
    var flt = AC.createBiquadFilter(); flt.type = 'lowpass';
    var t = AC.currentTime;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(flt); flt.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur);
  } catch (e) {}
}
var sfx = {
  shoot: function () { tone('square', 1150, 700, 0.045, 0.05); },
  hit:   function () { tone('triangle', 1500, 900, 0.035, 0.07); },
  boom:  function () { noise(0.26, 0.28, 2000, 140); tone('sine', 190, 60, 0.24, 0.16); },
  big:   function () { noise(0.44, 0.4, 2600, 90); tone('sine', 150, 40, 0.42, 0.24); },
  ene:   function () { tone('sawtooth', 420, 260, 0.09, 0.07); },
  hurt:  function () { tone('sawtooth', 300, 80, 0.3, 0.24); noise(0.14, 0.2, 1000, 200); },
  over:  function () { var q = [392, 311, 233, 165]; for (var i = 0; i < 4; i++) tone('triangle', q[i], q[i] * 0.94, 0.3, 0.14, i * 0.13); },
  click: function () { tone('sine', 900, 620, 0.06, 0.1); },
  start: function () { tone('sine', 520, 990, 0.16, 0.14); }
};

/* ---------------------------------------------------------------- 与宿主的 postMessage 桥接 */
var playerName = '同学', playerPoints = 0, lastScore = 0, awarded = 0, sent = [];
function post(m) {
  sent.push(m);
  if (sent.length > 20) sent.shift();
  try { if (window.parent && window.parent !== window) window.parent.postMessage(m, '*'); } catch (e) {}
}
window.addEventListener('message', function (e) {
  var d = (e.data && typeof e.data === 'object') ? e.data : {};
  if (d.type === 'danmaku-player') {
    playerName = String(d.name || '同学').slice(0, 10);
    playerPoints = Number(d.points) || 0;
    paintWho();
  }
});

/* ---------------------------------------------------------------- 词库（抽取不放回） */
var WORDS = ('CHAOS NEON PIXEL VORTEX NOVA CYBER ECHO ORBIT FLUX RAZOR TURBO ZERO ERROR RUSH STORM BLAST WAVE ' +
  'LASER GHOST VIRUS CRASH PULSE MATRIX HELLO WORLD SYNTH DATA GLITCH PHANTOM DRIFT SPARK BOLT VECTOR RETRO ' +
  'SHADOW HYPER MEGA OMEGA DELTA SIGNAL PROTO QUANT RIFT VOID ZONE SECTOR NEBULA COMET PLASMA STATIC FADE LOOP ' +
  'CODE BYTE HACK SYNC WARP FUSION CIRCUIT DIGIT HOLO AETHER BINARY PARADOX SURGE GRID').split(' ');
var pool = [];
function pickWord() {
  if (!pool.length) {
    pool = WORDS.slice();
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  }
  return pool.pop();
}

/* ---------------------------------------------------------------- 状态 */
var S = 'menu';                                  // menu | play | pause | over
var pad = { t: 54, b: 14, l: 16 };
var player = { x: 0, y: 0, tx: 0, ty: 0, r: 13, hr: 5, hp: 4, max: 4, inv: 0, cd: 0, tilt: 0 };
var enemies = [], pbs = [], ebs = [], parts = [], floats = [], streaks = [];
var score = 0, kills = 0, elapsed = 0, spawnT = 0, shake = 0, flash = 0, level = 1, best = 0;
var keys = {}, drag = { on: false, id: -1, x: 0, y: 0 };

function padL() { return (pad.l + 6) * U; }
function minY() { return pad.t * U + player.r; }
function maxY() { return H - pad.b * U - player.r; }
function maxX() { return W - padL(); }

/* ---------------------------------------------------------------- 布局 */
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width = Math.max(1, Math.round(W * dpr));
  cv.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  U = Math.max(0.66, Math.min(H / 430, W / 540));
  player.r = 13 * U; player.hr = 5 * U;
  player.tx = clamp(player.tx, padL(), maxX());
  player.ty = clamp(player.ty, minY(), maxY());
  buildStreaks();
}
function buildStreaks() {
  streaks = [];
  var n = Math.round(W / 46);
  for (var i = 0; i < n; i++) {
    streaks.push({ x: rnd(0, W), y: rnd(0, H), len: rnd(26, 90) * U,
                   sp: rnd(70, 190) * U, a: rnd(0.35, 1) });
  }
}

/* ---------------------------------------------------------------- 输入 */
window.addEventListener('keydown', function (e) {
  var k = String(e.key || '').toLowerCase();
  keys[k] = true;
  if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') e.preventDefault();
  if (k === 'escape') { if (S === 'play') pause(); else if (S === 'pause') resume(); return; }
  if ((k === 'enter' || k === ' ') && (S === 'menu' || S === 'over')) { e.preventDefault(); start(); }
}, { passive: false });
window.addEventListener('keyup', function (e) { keys[String(e.key || '').toLowerCase()] = false; });

cv.addEventListener('pointerdown', function (e) {
  audio();
  if (S !== 'play') return;
  drag.on = true; drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
window.addEventListener('pointermove', function (e) {
  if (!drag.on || e.pointerId !== drag.id || S !== 'play') return;
  /* 相对位移：手指移动多少，船跟着移动多少（放心把手指放在屏幕任意角落） */
  player.tx = clamp(player.tx + (e.clientX - drag.x) * 1.45, padL(), maxX());
  player.ty = clamp(player.ty + (e.clientY - drag.y) * 1.45, minY(), maxY());
  drag.x = e.clientX; drag.y = e.clientY;
  e.preventDefault();
}, { passive: false });
function endDrag(e) { if (drag.on && (!e || e.pointerId === drag.id)) { drag.on = false; drag.id = -1; } }
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', function () { endDrag(); if (S === 'play') pause(); });
document.addEventListener('visibilitychange', function () { if (document.hidden && S === 'play') pause(); });

/* ---------------------------------------------------------------- 生成 / 战斗 */
function spawn() {
  var kind = 0, r = Math.random();
  if (level >= 2 && r < 0.22) kind = 2; else if (r < 0.52) kind = 1;
  var word = pickWord();
  var fs = (kind === 2 ? 17 : 15) * U;
  ctx.font = font(fs, 800);
  var tw = ctx.measureText(word).width;
  var w = tw + (kind === 2 ? 36 : 28) * U, h = (kind === 2 ? 38 : 32) * U;
  var e = { kind: kind, word: word, x: 0, y: -h, w: w, h: h, vx: 0, vy: 0,
            hp: 0, max: 1, fire: 0, ph: Math.random() * 6.28, hit: 0, fs: fs };
  if (kind === 0) { e.vy = (52 + level * 5) * U; e.hp = e.max = 2 + word.length; e.fire = rnd(0.9, 2.3); }
  else if (kind === 1) { e.vy = (110 + level * 8) * U; e.hp = e.max = 1 + Math.round(word.length * 0.55);
                         e.fire = 0; e.vx = (Math.random() < 0.5 ? -1 : 1) * (26 + level * 5) * U; }
  else { e.vy = (34 + level * 3) * U; e.hp = e.max = 6 + word.length; e.fire = rnd(1.5, 2.8); }
  var lo = e.w / 2 + 14 * U, hi = W - e.w / 2 - 14 * U;
  e.x = lo + Math.random() * Math.max(1, hi - lo);
  enemies.push(e);
}

function shoot() {
  pbs.push({ x: player.x, y: player.y - player.r * 1.3, vy: -900 * U, r: 3 * U });
  sfx.shoot();
}

function eShoot(e) {
  var ax = player.x - e.x, ay = player.y - (e.y + e.h * 0.4);
  var d = Math.max(1, Math.hypot(ax, ay));
  var base = Math.atan2(ay / d, ax / d);
  var sp = (150 + level * 13) * U;
  var n = e.kind === 2 ? 3 : 1;
  for (var i = 0; i < n; i++) {
    var a = base + (i - (n - 1) / 2) * 0.22;
    ebs.push({ x: e.x, y: e.y + e.h * 0.45, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 4.4 * U });
  }
  sfx.ene();
}

function sparks(x, y, n, col) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, 6.283), sp = rnd(40, 260) * U;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                 r: rnd(1.4, 3.6) * U, t: 0, life: rnd(0.3, 0.75), c: col });
  }
}

function killEnemy(e) {
  kills++;
  var mul = e.kind === 1 ? 1.45 : (e.kind === 2 ? 1.6 : 1);
  var gain = Math.round((90 + 30 * e.word.length) * mul * comboMul());
  score += gain;
  floats.push({ x: e.x, y: e.y, t: 0, txt: '+' + gain, big: e.kind === 2 });
  sparks(e.x, e.y, e.kind === 2 ? 26 : 14, e.kind === 2 ? C.accent2 : C.accent);
  shake = Math.max(shake, (e.kind === 2 ? 13 : 6) * U);
  if (e.kind === 2) sfx.big(); else sfx.boom();
  paintHud();
}
function comboMul() { return 1 + Math.min(8, Math.floor(kills / 4)) * 0.25; }

function hurt() {
  if (player.inv > 0) return;
  player.hp--; player.inv = 2.3; shake = 18 * U; flash = 1;
  sparks(player.x, player.y, 24, C.red);
  sfx.hurt();
  paintPips();
  if (player.hp <= 0) gameOver();
}

/* ---------------------------------------------------------------- 每帧逻辑 */
function update(dt) {
  elapsed += dt;
  level = Math.min(7, 1 + Math.floor(elapsed / 18));

  spawnT -= dt;
  if (spawnT <= 0) {
    spawn();
    spawnT = Math.max(0.46, 1.8 - level * 0.17) * rnd(0.78, 1.28);
  }

  /* 键盘走位 */
  var ax = 0, ay = 0;
  if (keys.a || keys.arrowleft) ax -= 1;
  if (keys.d || keys.arrowright) ax += 1;
  if (keys.w || keys.arrowup) ay -= 1;
  if (keys.s || keys.arrowdown) ay += 1;
  if (ax || ay) {
    var l = Math.hypot(ax, ay) || 1, sp = 460 * U;
    player.tx = clamp(player.tx + ax / l * sp * dt, padL(), maxX());
    player.ty = clamp(player.ty + ay / l * sp * dt, minY(), maxY());
  }

  /* 平滑跟随（指数趋近，帧率无关） */
  var k = 1 - Math.pow(0.0016, dt);
  var dx = (player.tx - player.x) * k, dy = (player.ty - player.y) * k;
  player.x += dx; player.y += dy;
  player.tilt += (clamp(dx * 0.05, -0.42, 0.42) - player.tilt) * Math.min(1, dt * 9);

  if (player.inv > 0) player.inv -= dt;
  player.cd -= dt;
  if (player.cd <= 0) { shoot(); player.cd = 0.115; }

  var i, j, b, e;
  for (i = 0; i < pbs.length; i++) pbs[i].y += pbs[i].vy * dt;
  for (i = pbs.length - 1; i >= 0; i--) if (pbs[i].y < -20 * U) pbs.splice(i, 1);

  /* 敌弹 */
  for (i = 0; i < ebs.length; i++) { b = ebs[i]; b.x += b.vx * dt; b.y += b.vy * dt; }
  for (i = ebs.length - 1; i >= 0; i--) {
    b = ebs[i];
    if (b.y > H + 30 * U || b.y < -60 * U || b.x < -40 * U || b.x > W + 40 * U) { ebs.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.hr) {
      ebs.splice(i, 1); sparks(b.x, b.y, 6, C.red); hurt();
    }
  }

  /* 敌机 */
  for (i = enemies.length - 1; i >= 0; i--) {
    e = enemies[i];
    e.y += e.vy * dt;
    if (e.hit > 0) e.hit -= dt;
    if (e.kind === 1) { e.x += e.vx * dt; if (e.x < e.w / 2 + 10 * U || e.x > W - e.w / 2 - 10 * U) e.vx *= -1; }
    else if (e.kind === 2) { e.ph += dt * 1.4; e.x += Math.sin(e.ph) * 26 * U * dt; }
    e.x = clamp(e.x, e.w / 2 + 6 * U, W - e.w / 2 - 6 * U);

    if (e.fire > 0) {
      e.fire -= dt;
      if (e.fire <= 0 && e.y > 0 && e.y < H * 0.72 && player.hp > 0) {
        eShoot(e);
        e.fire = e.kind === 2 ? rnd(2.0, 3.0) : rnd(1.6, 2.8);
      }
    }

    if (e.y - e.h / 2 > H + 24 * U) { enemies.splice(i, 1); continue; }

    /* 撞机：双方都掉血，避免"贴脸无敌" */
    if (Math.abs(player.x - e.x) < e.w / 2 + player.hr && Math.abs(player.y - e.y) < e.h / 2 + player.hr) {
      hurt();
      e.hp -= 3; e.hit = 0.14;
      if (e.hp <= 0) { killEnemy(e); enemies.splice(i, 1); continue; }
    }

    /* 玩家子弹命中 */
    for (j = pbs.length - 1; j >= 0; j--) {
      b = pbs[j];
      if (b.y < e.y - e.h / 2 - b.r * 2 || b.y > e.y + e.h / 2 + b.r * 2) continue;
      if (Math.abs(b.x - e.x) > e.w / 2 + b.r) continue;
      pbs.splice(j, 1);
      e.hp -= 1; e.hit = 0.12;
      sparks(b.x, e.y + e.h / 2, 3, C.accent);
      if (e.hp <= 0) { killEnemy(e); enemies.splice(i, 1); break; }
      sfx.hit();
    }
  }

  /* 粒子 / 飘字 / 震动 */
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.965; p.vy *= 0.965;
  }
  for (i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 0.9) floats.splice(i, 1); }
  if (shake > 0.2) shake *= Math.pow(0.02, dt); else shake = 0;
  if (flash > 0) flash = Math.max(0, flash - dt * 2.6);

  for (i = 0; i < streaks.length; i++) {
    var s = streaks[i];
    s.y += s.sp * dt * (S === 'play' ? 1 : 0.35);
    if (s.y > H + 60 * U) { s.y = -60 * U; s.x = rnd(0, W); }
  }
}

/* ---------------------------------------------------------------- 绘制 */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawStreaks() {
  ctx.save();
  ctx.lineWidth = Math.max(1, 1.2 * U);
  ctx.lineCap = 'round';
  for (var i = 0; i < streaks.length; i++) {
    var s = streaks[i];
    ctx.strokeStyle = C.streak;
    ctx.globalAlpha = s.a * 0.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.len); ctx.stroke();
  }
  ctx.restore();
}

function drawBullets() {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.shadowColor = C.glowA; ctx.shadowBlur = 10 * U;
  ctx.strokeStyle = C.accent; ctx.lineWidth = 2.6 * U;
  for (var i = 0; i < pbs.length; i++) {
    var b = pbs[i];
    ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + 11 * U); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.1 * U;
  for (i = 0; i < pbs.length; i++) {
    ctx.beginPath(); ctx.moveTo(pbs[i].x, pbs[i].y + 1 * U); ctx.lineTo(pbs[i].x, pbs[i].y + 6 * U); ctx.stroke();
  }
  ctx.restore();
}

function drawEnemies() {
  for (var i = 0; i < enemies.length; i++) drawChip(enemies[i]);
}

function drawChip(e) {
  var x = e.x - e.w / 2, y = e.y - e.h / 2, r = e.h * 0.34;
  ctx.save();
  ctx.shadowColor = e.hit > 0 ? C.glowR : C.shadow;
  ctx.shadowBlur = (e.hit > 0 ? 22 : 13) * U;
  ctx.shadowOffsetY = 4 * U;
  var g = ctx.createLinearGradient(x, y, x, y + e.h);
  g.addColorStop(0, e.hit > 0 ? (DARK ? 'rgba(90,40,46,.95)' : 'rgba(255,232,232,.96)') : C.chip0);
  g.addColorStop(1, e.hit > 0 ? (DARK ? 'rgba(60,26,32,.92)' : 'rgba(255,214,216,.92)') : C.chip1);
  ctx.fillStyle = g;
  rr(x, y, e.w, e.h, r); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  /* 玻璃边缘：外描边 + 内侧高光，跟站点的 glass 一致 */
  ctx.lineWidth = Math.max(1, 1.1 * U);
  ctx.strokeStyle = C.edge;
  rr(x + 0.5, y + 0.5, e.w - 1, e.h - 1, r); ctx.stroke();
  var sg = ctx.createLinearGradient(x, y, x, y + e.h * 0.7);
  sg.addColorStop(0, 'rgba(255,255,255,' + (DARK ? '.16' : '.55') + ')');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  rr(x + 1.5, y + 1.5, e.w - 3, e.h * 0.66, r * 0.9); ctx.fill();

  /* 血条 */
  var hw = e.w - 18 * U, hx = x + 9 * U, hy = y + e.h - 6 * U, ratio = Math.max(0, e.hp / e.max);
  ctx.fillStyle = C.hair; rr(hx, hy, hw, 2.8 * U, 1.6 * U); ctx.fill();
  ctx.fillStyle = ratio > 0.6 ? C.green : (ratio > 0.3 ? C.orange : C.red);
  if (ratio > 0) { rr(hx, hy, hw * ratio, 2.8 * U, 1.6 * U); ctx.fill(); }

  ctx.fillStyle = e.hit > 0 ? C.red : C.ink;
  ctx.font = font(e.fs, 800);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(e.word, e.x, y + e.h * 0.40);
  ctx.restore();
}

function drawPlayer() {
  if (S === 'over') return;
  var r = player.r;
  ctx.save();
  ctx.globalAlpha = player.inv > 0 ? 0.34 + 0.66 * Math.abs(Math.sin(elapsed * 15)) : 1;
  ctx.translate(player.x, player.y);
  ctx.rotate(player.tilt * 0.45);

  var fl = r * 1.7 * (0.75 + Math.random() * 0.5);
  var fg = ctx.createLinearGradient(0, r * 0.4, 0, r * 0.4 + fl);
  fg.addColorStop(0, 'rgba(255,255,255,.92)');
  fg.addColorStop(0.38, C.flame);
  fg.addColorStop(1, 'rgba(10,108,255,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-r * 0.36, r * 0.40); ctx.lineTo(0, r * 0.40 + fl); ctx.lineTo(r * 0.36, r * 0.40);
  ctx.closePath(); ctx.fill();

  ctx.shadowColor = C.glowA; ctx.shadowBlur = 16 * U;
  var g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, C.accent); g.addColorStop(1, C.accent2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.15);
  ctx.quadraticCurveTo(r * 0.55, -r * 0.20, r * 0.88, r * 0.60);
  ctx.quadraticCurveTo(r * 0.30, r * 0.32, 0, r * 0.50);
  ctx.quadraticCurveTo(-r * 0.30, r * 0.32, -r * 0.88, r * 0.60);
  ctx.quadraticCurveTo(-r * 0.55, -r * 0.20, 0, -r * 1.15);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.ellipse(-r * 0.24, -r * 0.30, r * 0.20, r * 0.40, -0.55, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(0, -r * 0.22, r * 0.22, 0, 6.2832); ctx.fill();
  ctx.restore();
}

function drawParts() {
  ctx.save();
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - p.t / p.life * 0.6), 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawFloats() {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < floats.length; i++) {
    var f = floats[i], k = f.t / 0.9;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = font((f.big ? 18 : 15) * U, 800);
    ctx.fillStyle = f.big ? C.accent2 : C.accent;
    ctx.fillText(f.txt, clamp(f.x, 30 * U, W - 30 * U), Math.max(f.y - k * 46 * U, pad.t * U + 18 * U));
  }
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.4) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  drawStreaks();
  drawBullets();
  drawEnemies();
  drawParts();
  drawPlayer();
  drawFloats();
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(229,72,77,' + (flash * 0.2).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------------------------------------------------------- HUD / 面板 */
function fmtTime(s) {
  var m = Math.floor(s / 60), q = Math.floor(s % 60);
  return (m < 10 ? '0' : '') + m + ':' + (q < 10 ? '0' : '') + q;
}
function paintPips() {
  var box = $('pips'), html = '';
  for (var i = 0; i < player.max; i++) html += '<i class="pip' + (i < player.hp ? ' on' : '') + '"></i>';
  box.innerHTML = html;
}
function paintHud() {
  $('score').textContent = String(score);
  $('clock').textContent = fmtTime(elapsed);
  var m = comboMul(), c = $('combo');
  if (m > 1) { c.hidden = false; c.textContent = 'x' + m.toFixed(2).replace(/0+$/, '').replace(/[.]$/, ''); }
  else c.hidden = true;
}
function paintWho() {
  var w = $('who');
  w.textContent = playerName + ' ';
  var sp = document.createElement('span');
  sp.className = 'pts';
  sp.textContent = playerPoints + ' 分';
  w.appendChild(sp);
  $('mPts').textContent = String(playerPoints);
  $('mBest').textContent = String(best);
}
function toast(text) {
  var d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  $('layer').appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1600);
}
function hideAll() {
  $('menu').hidden = true; $('over').hidden = true; $('pause').hidden = true;
}

function start() {
  audio();
  if (AC && AC.state === 'suspended') AC.resume();
  enemies = []; pbs = []; ebs = []; parts = []; floats = [];
  score = 0; kills = 0; elapsed = 0; spawnT = 1.2; shake = 0; flash = 0; level = 1;
  lastScore = 0; awarded = 0;
  player.hp = player.max; player.inv = 1.6; player.cd = 0; player.tilt = 0;
  player.x = player.tx = W / 2;
  player.y = player.ty = H * 0.76;
  S = 'play';
  hideAll(); paintPips(); paintHud();
  sfx.start();
}
function pause() { if (S !== 'play') return; S = 'pause'; endDrag(); $('pause').hidden = false; }
function resume() { if (S !== 'pause') return; $('pause').hidden = true; S = 'play'; last = 0; }
function toMenu() { S = 'menu'; endDrag(); enemies = []; pbs = []; ebs = []; parts = []; floats = []; hideAll(); $('menu').hidden = false; paintWho(); }
function lobby() { try { window.parent.location.hash = '#/games'; } catch (e) {} }

function gameOver() {
  S = 'over';
  lastScore = score;
  awarded = Math.floor(score / 20000);
  if (score > best) { best = score; try { localStorage.setItem('danmaku.best', String(best)); } catch (e) {} }
  post({ type: 'danmaku-score', score: score });
  sfx.over();
  $('ovTitle').textContent = (score >= best && score > 0) ? '新纪录！' : '本局结束';
  $('ovScore').textContent = String(score);
  $('ovKill').textContent = String(kills);
  $('ovTime').textContent = fmtTime(elapsed);
  var need = 20000 - (score % 20000);
  $('ovAward').textContent = awarded > 0
    ? ('本局可结算 +' + awarded + ' 积分（以服务端为准）')
    : ('再打 ' + need + ' 分就能换 1 积分');
  paintWho();
  $('over').hidden = false;
}

/* ---------------------------------------------------------------- 横屏 / 全屏 */
var skipRotate = false;
function portrait() { return window.innerHeight > window.innerWidth * 1.02; }
function syncRotate() {
  var need = portrait() && !skipRotate;
  $('rotate').hidden = !need;
}
function goFull() {
  skipRotate = true;
  var el = document.documentElement, p = null;
  try {
    if (el.requestFullscreen) p = el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
  } catch (e) { p = null; }
  var lock = function () {
    try {
      if (window.screen && screen.orientation && screen.orientation.lock) {
        var r = screen.orientation.lock('landscape');
        if (r && r.catch) r.catch(function () {});
      }
    } catch (e) {}
  };
  if (p && p.then) p.then(lock, lock); else lock();
  setTimeout(syncRotate, 260);
}

/* ---------------------------------------------------------------- 启动 */
function boot() {
  try { best = Number(localStorage.getItem('danmaku.best')) || 0; } catch (e) { best = 0; }
  try { muted = localStorage.getItem('danmaku.mute') === '1'; } catch (e) {}
  theme(); resize(); paintPips(); paintHud(); paintWho(); paintMute();

  $('go').addEventListener('click', function () { sfx.click(); start(); });
  $('gofs').addEventListener('click', function () { sfx.click(); goFull(); start(); });
  $('resume').addEventListener('click', function () { sfx.click(); resume(); });
  $('quit').addEventListener('click', function () { sfx.click(); toMenu(); });
  $('again').addEventListener('click', function () { sfx.click(); start(); });
  $('back').addEventListener('click', function () { sfx.click(); lobby(); });
  $('rotGo').addEventListener('click', function () { sfx.click(); goFull(); syncRotate(); });
  $('rotSkip').addEventListener('click', function () { skipRotate = true; syncRotate(); });
  $('pause').addEventListener('click', function () { if (S === 'play') pause(); else if (S === 'pause') resume(); });
  $('mute').addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem('danmaku.mute', muted ? '1' : '0'); } catch (e) {}
    if (!muted) { audio(); if (AC && AC.state === 'suspended') AC.resume(); sfx.click(); }
    paintMute();
  });

  window.addEventListener('resize', function () {
    resize(); syncRotate();
  });
  window.addEventListener('orientationchange', function () { setTimeout(function () { resize(); syncRotate(); }, 260); });
  if (window.matchMedia) {
    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', theme);
    } catch (e) {}
  }
  syncRotate();
  /* 回归测试钩子：只有 URL 带 ?test=1 才挂，正常游玩完全不受影响 */
  if (/[?&]test=1/.test(location.search)) {
    window.__dm = {
      st: function () { return { state: S, score: score, hp: player.hp, kills: kills, elapsed: elapsed, sent: sent.slice() }; },
      set: function (o) {
        o = o || {};
        if (typeof o.score === 'number') score = o.score;
        if (typeof o.hp === 'number') { player.hp = o.hp; paintPips(); }
        paintHud();
        return window.__dm.st();
      },
      over: function () { gameOver(); return window.__dm.st(); }
    };
  }
  post({ type: 'danmaku-ready' });
  window.requestAnimationFrame(frame);
}

var last = 0;
function frame(ts) {
  window.requestAnimationFrame(frame);
  if (!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (S === 'play') {
    update(dt);
    paintHud();
  } else {
    for (var i = 0; i < streaks.length; i++) {
      var s = streaks[i];
      s.y += s.sp * dt * 0.35;
      if (s.y > H + 60 * U) { s.y = -60 * U; s.x = rnd(0, W); }
    }
  }
  render();
}
function paintMute() {
  $('mute').innerHTML = muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="M15.4 8.6a5 5 0 0 1 0 6.8M18 6a8.5 8.5 0 0 1 0 12"/></svg>';
}

/* 字体就绪后重新清一次缓存文本度量不必要，直接启动 */
if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
  document.fonts.ready.then(function () { /* 系统字体无需重排 */ });
}
theme();
boot();
})();
</script>
</body>
